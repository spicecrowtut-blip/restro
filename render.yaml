databases:
  - name: borcelle-db
    databaseName: borcelle
    user: borcelle
    plan: free

services:
  - type: web
    name: borcelle
    runtime: node
    rootDir: borcelle
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: borcelle-db
          property: connectionString
      - key: BORCELLE_ADMIN_LOGIN
        sync: false
      - key: BORCELLE_ADMIN_PASSWORD
        sync: false
      - key: BORCELLE_SESSION_SECRET
        generateValue: true
